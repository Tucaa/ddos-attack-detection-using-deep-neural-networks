# Docker Compose configuration for DDoS Detection system
# Contents: Ollama LLM engine + FastAPI inference service

services:

  # Ollama LLM engine
  llama-engine:
    image: ollama/ollama:latest
    container_name: llama-engine

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

    # Healthcheck — ceka dok Ollama API stvarno ne postane dostupan
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped

    networks:
      - internal-net

  # Ollama model init (pokrece se jednom, povlaci model ako ga nema)
  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init

    depends_on:
      llama-engine:
        condition: service_healthy

    # Zameni <ime-modela> sa stvarnim imenom, npr. llama3.2, mistral, itd.
    entrypoint: >
      sh -c "ollama pull llama3.1:8b"

    environment:
      - OLLAMA_HOST=http://llama-engine:11434

    networks:
      - internal-net

    # Pokrecemo ga samo jednom pri compose up
    restart: "no"

  #FastAPI inference servis
  api-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fast-api-app

    # Ceka healthcheck llama-engine, ne samo pokretanje kontejnera
    depends_on:
      llama-engine:
        condition: service_healthy

    ports:
      - "8000:8000"

    environment:
      - OLLAMA_HOST=http://llama-engine:11434
      - CUDA_VISIBLE_DEVICES=0

    volumes:
      - .:/app

    working_dir: /app

    command: >
      uvicorn api.main:app
      --host 0.0.0.0
      --port 8000
      --reload

    # GPU potreban za PyTorch LSTM inferencu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    restart: unless-stopped

    networks:
      - internal-net

# Volumes i mreže

volumes:
  ollama_data:

networks:
  internal-net:
    driver: bridge